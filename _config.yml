title: Cantapueblo
description: "La Fiesta Coral de Latinoamérica — Mendoza, Argentina"
baseurl: ""
url: "https://cantapueblo.musica.ar"

markdown: kramdown
theme: null

defaults:
  - scope:
      path: ""
    values:
      layout: "default"

exclude:
  - NOTES.md
  # Programa genérico oculto: el programa detallado vive en la pestaña 2026.
  # Para volver a publicarlo, borrá estas 3 líneas (y reactivá el enlace en _includes/nav.html).
  - es/programa.html
  - en/programme.html
  - fr/programme.html
  - README.md
  - Gemfile
  - Gemfile.lock

plugins:
  - jekyll-sitemap
