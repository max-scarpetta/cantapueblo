# =====================================================================
# EDICIÓN 2026 (38.ª edición) — registro del festival, 11 al 14 de noviembre
#
# Este es el ÚNICO archivo que hay que tocar para completar la sección 2026.
# Las páginas /es/2026.html, /en/2026.html y /fr/2026.html lo leen solas.
#
# FOTOS DE LOS COROS
#   1. Subí la foto (.webp, ancho máx. 1600 px) a  assets/img/2026/coros/
#   2. En el coro, agregá la línea:   photo: nacer-vocal.webp
#
# FOTOS DEL FESTIVAL (las que saque Flor), por día
#   1. Subí la imagen a  assets/img/2026/
#   2. En el día, reemplazá  photos: []  por:
#
#        photos:
#          - file: dia13-alturas-01.webp
#            caption:
#              es: "Los coros al pie del Aconcagua"
#              en: "The choirs at the foot of Aconcagua"
#              fr: "Les chœurs au pied de l'Aconcagua"
#
#      (caption es opcional: si no lo querés, dejá solo "- file: ...")
#
# VIDEOS
#   - De YouTube: copiá el código del link (youtube.com/watch?v=ESTE_CODIGO)
#        videos:
#          - youtube: AG4jC52Dxh0
#            title: { es: "Concierto Final", en: "Final Concert", fr: "Concert final" }
#   - Archivo propio (clips cortos, idealmente < 20 MB) en assets/video/2026/:
#          - file: clip-cantata.mp4
#
# CAMBIAR UN CONCIERTO: horario (time), sede (venue), entradas (access:
#   free | tickets, y ticket_url), o sumar/quitar coros (lista choirs con los
#   "id" de la sección choirs de más abajo).
#
# RESUMEN FINAL: las fotos y videos de  highlights  (al fondo) aparecen como
#   bloque "Lo mejor de la edición" recién cuando hay al menos uno.
# =====================================================================

