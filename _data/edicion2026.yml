days:
  - id: dia11
    num: 11
    weekday: { es: "Miércoles", en: "Wednesday", fr: "Mercredi" }
    events:
      - time: "21:00"
        title: { es: "Concierto Apertura", en: "Opening Concert", fr: "Concert d'ouverture" }
        venue: { name: "Nave UNCUYO", address: "Maza y Av. España, Ciudad" }
        access: tickets
        choirs: [ninos-uncuyo, camara-uncuyo, amicana, vozeres]
    photos: []
    videos: []

  - id: dia12
    num: 12
    weekday: { es: "Jueves", en: "Thursday", fr: "Jeudi" }
    events:
      - time: "21:00"
        title: { es: "Concierto de los Pueblos", en: "Concert of the Peoples", fr: "Concert des Peuples" }
        venue: { name: "Espacio Cultural Julio Le Parc", room: "Sala Vilma Rupolo", address: "Av. Mitre esq. Godoy Cruz, Guaymallén" }
        access: tickets
        choirs: [efren-jurado, jaboneria, vozeres, ciudad-mendoza, cantapueblo]
      - time: "21:00"
        title: { es: "Concierto por la Vida", en: "Concert for Life", fr: "Concert pour la Vie" }
        venue: { name: "Espacio Cultural Julio Le Parc", room: "Sala Tito Francia", address: "Av. Mitre esq. Godoy Cruz, Guaymallén" }
        access: tickets
        choirs: [abogados-neuquen, esloveno, aluen, colegio-central]
      - time: "21:00"
        title: { es: "Concierto por la Esperanza", en: "Concert for Hope", fr: "Concert pour l'Espoir" }
        venue: { name: "Iglesia de Jesucristo de los Santos de los Últimos Días", address: "Francisco de la Reta 394, San José, Guaymallén" }
        access: free
        choirs: [canto-vida-tucuman, nn-vocal, nacer-vocal, torrontes]
    photos: []
    videos: []

  - id: dia13
    num: 13
    weekday: { es: "Viernes", en: "Friday", fr: "Vendredi" }
    events:
      - time: "12:30"
        title: { es: "Concierto en las Alturas", en: "Concert in the Heights", fr: "Concert dans les Hauteurs" }
        subtitle: { es: "Los coros cantan al pie del Aconcagua", en: "The choirs sing at the foot of Aconcagua", fr: "Les chœurs chantent au pied de l'Aconcagua" }
        choirs: [canto-vida-tucuman, efren-jurado, aluen, abogados-neuquen, nacer-vocal, vozeres]
      - time: "21:00"
        title: { es: "Concierto por la Paz", en: "Concert for Peace", fr: "Concert pour la Paix" }
        venue: { name: "Teatro Independencia", address: "Chile y Espejo, Ciudad" }
        access: tickets
        ticket_url: "https://www.entradaweb.com.ar/evento/ed5b1d9e/step/1"
        choirs: [aluen, canto-coral-argentino, abogados-neuquen, vozeres, universidad-aconcagua]
      - time: "21:00"
        title: { es: "Concierto por la Democracia", en: "Concert for Democracy", fr: "Concert pour la Démocratie" }
        venue: { name: "Espacio Cultural Julio Le Parc", room: "Sala Armando Tejada Gómez", address: "Av. Mitre esq. Godoy Cruz, Guaymallén" }
        access: tickets
        choirs: [nacer-vocal, julian-aguirre, osep, ninos-malargue, hugo-cabrera]
      - time: "21:00"
        title: { es: "El Canto de los Grandes", en: "El Canto de los Grandes", fr: "El Canto de los Grandes" }
        venue: { name: "Auditorio Dr. Gustavo Kent, Hospital Universitario", address: "Paso de los Andes 3051, Ciudad" }
        access: hospital
        note: { es: "Lo recaudado es a total beneficio de la Cooperadora del Hospital Universitario.", en: "All proceeds go to the Hospital Universitario's Cooperadora (support association).", fr: "Les recettes sont intégralement reversées à la Cooperadora de l'Hôpital Universitaire." }
        choirs: [canto-vida-mendoza, canto-vida-tucuman, efren-jurado, adultos-mayores-las-heras]
    photos: []
    videos: []

  - id: dia14
    num: 14
    weekday: { es: "Sábado", en: "Saturday", fr: "Samedi" }
    events:
      - time: "12:00"
        title: { es: "Cantata Callejera", en: "Street Cantata", fr: "Cantate de rue" }
        subtitle: { es: "Los coros cantan en distintos espacios del centro de la ciudad de Mendoza", en: "The choirs sing in different spaces across downtown Mendoza", fr: "Les chœurs chantent dans différents lieux du centre-ville de Mendoza" }
      - time: "21:00"
        title: { es: "Concierto Final", en: "Final Concert", fr: "Concert final" }
        venue: { name: "Iglesia de los Jesuitas", address: "Colón y San Martín, Ciudad" }
        access: free
        note: { es: "Participan coros de Argentina, Ecuador y México.", en: "Choirs from Argentina, Ecuador and Mexico take part.", fr: "Des chœurs d'Argentine, d'Équateur et du Mexique y participent." }
        # Programa del concierto, en orden. Cada bloque puede tener coros (lista de ids)
        # y canciones (title, label opcional, by opcional).
        segments:
          - title: { es: "Coros solistas · una canción por coro", en: "Solo choirs · one song each", fr: "Chœurs solistes · une chanson par chœur" }
            choirs: [canto-vida-mendoza, akis, canto-vida-tucuman, adultos-mayores-las-heras, efren-jurado]
            songs:
              - label: { es: "Todos cantan", en: "All sing", fr: "Tous chantent" }
                title: "Anhelo"
                by: { es: "Dirige Carlos Villacres Velástegui, director de los coros de adultos mayores (Ecuador)", en: "Conducted by Carlos Villacres Velástegui, director of the older adults' choirs (Ecuador)", fr: "Sous la direction de Carlos Villacres Velástegui, directeur des chœurs d'adultes âgés (Équateur)" }
          - title: { es: "Coros solistas · una canción por coro", en: "Solo choirs · one song each", fr: "Chœurs solistes · une chanson par chœur" }
            choirs: [ninos-malargue, aluen, canto-coral-argentino, abogados-neuquen, hugo-cabrera, nacer-vocal, cantapueblo, vozeres]
          - title: { es: "Canciones de masa coral", en: "Mass choir songs", fr: "Chants d'ensemble" }
            songs:
              - title: "El jilguerillo"
                by: { es: "Dirige Edgard González Salzmann (México)", en: "Conducted by Edgard González Salzmann (Mexico)", fr: "Sous la direction d'Edgard González Salzmann (Mexique)" }
              - title: "Los ojos del amor"
                by: { es: "Dirige Nancy Ciccioli (Mendoza)", en: "Conducted by Nancy Ciccioli (Mendoza)", fr: "Sous la direction de Nancy Ciccioli (Mendoza)" }
              - title: "Canción con todos"
                by: { es: "Dirige Nancy Ciccioli (Mendoza)", en: "Conducted by Nancy Ciccioli (Mendoza)", fr: "Sous la direction de Nancy Ciccioli (Mendoza)" }
    photos: []
    videos: []

